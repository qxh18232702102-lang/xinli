<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>情绪大数据看板</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        body { background-color: #0f172a; color: white; font-family: sans-serif; padding: 20px; }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { margin: 0; font-size: 28px; color: #38bdf8; }
        .chart-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; }
        .card { background: #1e293b; border-radius: 12px; padding: 20px; width: 600px; height: 400px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .card-title { font-size: 18px; font-weight: bold; margin-bottom: 15px; border-left: 4px solid #38bdf8; padding-left: 10px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>📊 多模态情绪分析系统 - 数据驾驶舱</h1>
        <p>Real-time Emotion Data Monitoring</p>
    </div>

    <div class="chart-container">
        <div class="card">
            <div class="card-title">用户情绪分布占比</div>
            <div id="pieChart" style="width: 100%; height: 350px;"></div>
        </div>
        <div class="card">
            <div class="card-title">情绪检出数量统计</div>
            <div id="barChart" style="width: 100%; height: 350px;"></div>
        </div>
    </div>

    <script>
        // 初始化图表
        const pieChart = echarts.init(document.getElementById('pieChart'));
        const barChart = echarts.init(document.getElementById('barChart'));

        // 从后端获取数据
        fetch('http://127.0.0.1:5000/get/stats')
            .then(response => response.json())
            .then(data => {
                // 1. 配置饼图
                pieChart.setOption({
                    tooltip: { trigger: 'item' },
                    legend: { bottom: '5%', textStyle: { color: '#fff' } },
                    series: [{
                        name: '情绪类型',
                        type: 'pie',
                        radius: ['40%', '70%'],
                        itemStyle: { borderRadius: 10, borderColor: '#fff', borderWidth: 2 },
                        data: data
                    }]
                });

                // 2. 配置柱状图
                const names = data.map(item => item.name);
                const values = data.map(item => item.value);
                barChart.setOption({
                    tooltip: { trigger: 'axis' },
                    xAxis: { type: 'category', data: names, axisLabel: { color: '#fff' } },
                    yAxis: { type: 'value', axisLabel: { color: '#fff' } },
                    series: [{
                        data: values,
                        type: 'bar',
                        itemStyle: { color: '#38bdf8' }
                    }]
                });
            })
            .catch(err => alert("无法连接后端，请检查 python app.py 是否启动"));
    </script>
</body>
</html>
