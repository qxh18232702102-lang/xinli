<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>登录 - 情绪智能分析系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        /* 全局设置 */
        body { 
            background: #fbfbfd; 
            height: 100vh; 
            width: 100vw;
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            margin: 0;
        }

        .stage {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* ================= 视觉锚点 ================= */
        .visual-anchor {
            position: absolute;
            top: 38%; 
            left: 50%;
            transform: translate(-50%, -50%) scale(1);
            transition: all 1.2s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mode-login .visual-anchor {
            top: 18%; /* 登录时上移 */
            transform: translate(-50%, -50%) scale(0.55);
        }

        .particle-ring {
            position: relative;
            width: 300px;
            height: 300px;
            animation: slowSpin 60s linear infinite;
        }

        .dot-pos {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0; height: 0;
        }

        .dot {
            position: absolute;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            opacity: 0;
            animation: popIn 1s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        .brain-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 6rem;
            background: linear-gradient(135deg, #7F7FD5, #86A8E7, #91EAE4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            z-index: 20;
            filter: drop-shadow(0 10px 20px rgba(108, 92, 231, 0.2));
        }

        /* ================= 文字层 ================= */
        .intro-layer {
            position: absolute;
            top: 68%;
            text-align: center;
            transition: all 0.6s ease;
            opacity: 1;
            transform: translateY(0);
            width: 100%;
            z-index: 30;
        }

        .mode-login .intro-layer {
            opacity: 0;
            transform: translateY(20px);
            pointer-events: none;
        }

        .main-title {
            font-size: 2.5rem;
            font-weight: 800;
            color: #1d1d1f;
            letter-spacing: -1px;
            margin-bottom: 0.5rem;
            text-shadow: 0 2px 10px rgba(255,255,255,0.8);
        }

        .sub-title {
            font-size: 1rem;
            color: #86868b;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 40px;
        }

        .btn-entry {
            padding: 15px 50px;
            border-radius: 50px;
            background: #1d1d1f;
            color: white;
            border: none;
            font-size: 1.1rem;
            cursor: pointer;
            transition: transform 0.2s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .btn-entry:hover { transform: scale(1.05); background: black; }

        /* ================= 表单层 ================= */
        .form-layer {
            position: absolute;
            top: 45%; 
            width: 320px;
            opacity: 0;
            visibility: hidden;
            transform: translateY(40px);
            transition: all 1s cubic-bezier(0.16, 1, 0.3, 1) 0.2s;
            z-index: 40;
        }

        .mode-login .form-layer {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        /* 表单组容器，用于包裹输入框和错误提示 */
        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .custom-input {
            width: 100%;
            border: 1px solid transparent; /* 预留边框位置 */
            padding: 18px 24px;
            font-size: 1rem;
            outline: none;
            background: #eaf0f6; 
            border-radius: 16px; 
            color: #333;
            transition: all 0.3s;
        }
        .custom-input:focus {
            background: #e2e8f0;
            transform: scale(1.02);
        }
        .custom-input::placeholder { color: #8fa0b0; }

        /* 🔥 错误状态下的输入框样式 */
        .custom-input.is-invalid {
            background: #fff0f0; /* 浅红背景 */
            border-color: #ff4757; /* 红边框 */
            color: #ff4757;
        }

        /* 🔥 错误提示信息样式 (完美复刻图片效果) */
        .error-feedback {
            display: flex;
            align-items: center;
            color: #ff3b30; /* Apple Red */
            font-size: 0.85rem;
            margin-top: 8px;
            margin-left: 5px;
            opacity: 0;
            transform: translateY(-5px);
            transition: all 0.3s ease;
            visibility: hidden;
            height: 0; /* 初始不占高度 */
        }

        /* 显示错误时的状态 */
        .error-feedback.show {
            opacity: 1;
            transform: translateY(0);
            visibility: visible;
            height: auto; /* 撑开高度 */
            margin-bottom: 5px;
        }

        .error-feedback i {
            margin-right: 6px;
            font-size: 1rem;
        }

        .btn-login {
            width: 100%;
            padding: 18px;
            border-radius: 16px;
            background: #2d2d2d;
            color: white;
            border: none;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: transform 0.2s, background 0.2s;
            margin-top: 10px;
        }
        .btn-login:hover { 
            transform: scale(1.02); 
            background: #000;
        }

        .back-link {
            text-align: right;
            color: #86868b;
            font-size: 0.9rem;
            cursor: pointer;
        }
        
        .reg-link {
            text-decoration: none;
            color: #86868b;
            font-size: 0.9rem;
        }
        
        @keyframes slowSpin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        @keyframes popIn {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="stage">
        
        <div class="visual-anchor">
            <div class="particle-ring" id="dotWrapper"></div>
            <i class="fas fa-brain brain-icon"></i>
        </div>

        <div class="intro-layer">
            <h1 class="main-title">情绪智能分析系统</h1>
            <p class="sub-title">Voice + Cloud + Edge</p>
            <button class="btn-entry" onclick="enterLogin()">进入系统</button>
        </div>

        <div class="form-layer">
            <form id="loginForm" action="/login" method="POST" onsubmit="return validateForm()">
                
                <div class="form-group">
                    <input type="text" id="username" name="username" class="custom-input" placeholder="用户名" autocomplete="off">
                    <div class="error-feedback" id="error-username">
                        <i class="fas fa-circle-exclamation"></i>
                        <span>用户名至少需要3个字符</span>
                    </div>
                </div>

                <div class="form-group">
                    <input type="password" id="password" name="password" class="custom-input" placeholder="密码">
                    <div class="error-feedback" id="error-password">
                        <i class="fas fa-circle-exclamation"></i>
                        <span>请输入密码</span>
                    </div>
                </div>

                <button type="submit" class="btn-login">立即登录</button>
            </form>

            <div class="d-flex justify-content-between px-2 mt-3">
                <a href="/register" class="reg-link">注册新账号</a>
                <span class="back-link" onclick="exitLogin()">返回</span>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}
                <div class="alert alert-danger mt-3 py-2 small text-center rounded-3 border-0 shadow-sm" style="background:#fff0f0; color:#ff4757;">
                    <i class="fas fa-circle-exclamation me-1"></i> {{ messages[0][1] }}
                </div>
              {% endif %}
            {% endwith %}
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const wrapper = document.getElementById('dotWrapper');
            const colors = ['#FF3B30', '#FF9500', '#FFCC00', '#4CD964', '#5AC8FA', '#007AFF', '#5856D6', '#FF2D55'];
            
            const layers = [
                { count: 12, radius: 80, sizeMin: 8, sizeMax: 10 },
                { count: 20, radius: 110, sizeMin: 6, sizeMax: 9 },
                { count: 32, radius: 140, sizeMin: 4, sizeMax: 7 } 
            ];

            layers.forEach((layer) => {
                for (let i = 0; i < layer.count; i++) {
                    const pos = document.createElement('div');
                    pos.classList.add('dot-pos');
                    const angle = (i / layer.count) * 360;
                    pos.style.transform = `rotate(${angle}deg) translate(${layer.radius}px) rotate(-${angle}deg)`;
                    
                    const dot = document.createElement('div');
                    dot.classList.add('dot');
                    const size = Math.random() * (layer.sizeMax - layer.sizeMin) + layer.sizeMin;
                    dot.style.width = size + 'px';
                    dot.style.height = size + 'px';
                    dot.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    dot.style.boxShadow = `0 0 6px ${dot.style.backgroundColor}`;
                    dot.style.animationDelay = (Math.random() * 1) + 's';

                    pos.appendChild(dot);
                    wrapper.appendChild(pos);
                }
            });

            // 聚焦输入框时，自动清除错误状态
            const inputs = document.querySelectorAll('.custom-input');
            inputs.forEach(input => {
                input.addEventListener('focus', function() {
                    this.classList.remove('is-invalid');
                    const errorBox = this.nextElementSibling;
                    if(errorBox && errorBox.classList.contains('error-feedback')) {
                        errorBox.classList.remove('show');
                    }
                });
            });
        });

        function enterLogin() {
            document.body.classList.add('mode-login');
        }

        function exitLogin() {
            document.body.classList.remove('mode-login');
        }

        // 🔥 前端校验逻辑
        function validateForm() {
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            let isValid = true;

            // 校验用户名
            if (usernameInput.value.trim().length < 3) {
                showError(usernameInput, 'error-username', '用户名至少需要3个字符');
                isValid = false;
            }

            // 校验密码
            if (passwordInput.value.trim() === '') {
                showError(passwordInput, 'error-password', '请输入密码');
                isValid = false;
            }

            return isValid; // 如果返回 false，表单不会提交
        }

        function showError(inputElement, errorId, msg) {
            // 1. 输入框变红
            inputElement.classList.add('is-invalid');
            
            // 2. 显示错误提示文字
            const errorBox = document.getElementById(errorId);
            errorBox.querySelector('span').innerText = msg; // 更新文字
            errorBox.classList.add('show');
            
            // 3. 极微小的震动动画 (可选)
            inputElement.style.animation = 'shake 0.3s';
            setTimeout(() => inputElement.style.animation = '', 300);
        }
    </script>
    
    <style>
        /* 补充一个震动动画，增加交互感 */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
    </style>
</body>
</html>
