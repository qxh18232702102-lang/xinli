<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>注册 - 情绪智能分析系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        /* 全局设置 - 保持与登录页一致 */
        body { 
            background: #fbfbfd; 
            height: 100vh; 
            width: 100vw;
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            margin: 0;
        }

        .stage {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* ================= 视觉锚点 (上移以适应更长的表单) ================= */
        .visual-anchor {
            position: absolute;
            top: 38%; 
            left: 50%;
            transform: translate(-50%, -50%) scale(1);
            transition: all 1.2s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 注册模式下，图标移得更高一点，因为表单比较长 */
        .mode-register .visual-anchor {
            top: 15%; 
            transform: translate(-50%, -50%) scale(0.45);
        }

        .particle-ring {
            position: relative;
            width: 300px;
            height: 300px;
            animation: slowSpin 60s linear infinite;
        }

        .dot-pos {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0; height: 0;
        }

        .dot {
            position: absolute;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            opacity: 0;
            animation: popIn 1s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        .brain-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 6rem;
            background: linear-gradient(135deg, #00b894, #55efc4); /* 注册页用绿色系区分一下 */
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            z-index: 20;
            filter: drop-shadow(0 10px 20px rgba(0, 184, 148, 0.2));
        }

        /* ================= 文字层 ================= */
        .intro-layer {
            position: absolute;
            top: 68%;
            text-align: center;
            transition: all 0.6s ease;
            opacity: 1;
            transform: translateY(0);
            width: 100%;
            z-index: 30;
        }

        .mode-register .intro-layer {
            opacity: 0;
            transform: translateY(20px);
            pointer-events: none;
        }

        .main-title {
            font-size: 2.5rem;
            font-weight: 800;
            color: #1d1d1f;
            letter-spacing: -1px;
            margin-bottom: 0.5rem;
            text-shadow: 0 2px 10px rgba(255,255,255,0.8);
        }

        .sub-title {
            font-size: 1rem;
            color: #86868b;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 40px;
        }

        .btn-entry {
            padding: 15px 50px;
            border-radius: 50px;
            background: #1d1d1f;
            color: white;
            border: none;
            font-size: 1.1rem;
            cursor: pointer;
            transition: transform 0.2s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .btn-entry:hover { transform: scale(1.05); background: black; }

        /* ================= 表单层 ================= */
        .form-layer {
            position: absolute;
            top: 40%; /* 初始位置 */
            width: 320px;
            opacity: 0;
            visibility: hidden;
            transform: translateY(40px);
            transition: all 1s cubic-bezier(0.16, 1, 0.3, 1) 0.2s;
            z-index: 40;
        }

        .mode-register .form-layer {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .form-group {
            margin-bottom: 18px; /* 稍微紧凑一点 */
            position: relative;
        }

        .custom-input {
            width: 100%;
            border: 1px solid transparent;
            padding: 16px 24px;
            font-size: 0.95rem;
            outline: none;
            background: #eaf0f6; 
            border-radius: 16px; 
            color: #333;
            transition: all 0.3s;
        }
        .custom-input:focus {
            background: #e2e8f0;
            transform: scale(1.02);
        }
        .custom-input::placeholder { color: #8fa0b0; }

        /* 错误状态样式 */
        .custom-input.is-invalid {
            background: #fff0f0;
            border-color: #ff4757;
            color: #ff4757;
        }

        /* 错误提示文字 */
        .error-feedback {
            display: flex;
            align-items: center;
            color: #ff3b30;
            font-size: 0.8rem;
            margin-top: 6px;
            margin-left: 5px;
            opacity: 0;
            transform: translateY(-5px);
            transition: all 0.3s ease;
            visibility: hidden;
            height: 0;
        }

        .error-feedback.show {
            opacity: 1;
            transform: translateY(0);
            visibility: visible;
            height: auto;
            margin-bottom: 5px;
        }

        .error-feedback i {
            margin-right: 6px;
        }

        .btn-register {
            width: 100%;
            padding: 16px;
            border-radius: 16px;
            background: #2d2d2d;
            color: white;
            border: none;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: transform 0.2s, background 0.2s;
            margin-top: 10px;
        }
        .btn-register:hover { 
            transform: scale(1.02); 
            background: #000;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            color: #86868b;
            font-size: 0.9rem;
            display: block;
            text-decoration: none;
            transition: color 0.3s;
            cursor: pointer;
        }
        .login-link:hover { color: #1d1d1f; }
        
        @keyframes slowSpin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        @keyframes popIn {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="stage">
        
        <div class="visual-anchor">
            <div class="particle-ring" id="dotWrapper"></div>
            <i class="fas fa-brain brain-icon"></i>
        </div>

        <div class="intro-layer">
            <h1 class="main-title">加入我们</h1>
            <p class="sub-title">Create your account</p>
            <button class="btn-entry" onclick="enterRegister()">开始注册</button>
        </div>

        <div class="form-layer">
            <form id="regForm" action="/register" method="POST" onsubmit="return validateForm()">
                
                <div class="form-group">
                    <input type="text" id="username" name="username" class="custom-input" placeholder="设置用户名" autocomplete="off">
                    <div class="error-feedback" id="error-username">
                        <i class="fas fa-circle-exclamation"></i><span>用户名至少3个字符</span>
                    </div>
                </div>

                <div class="form-group">
                    <input type="email" id="email" name="email" class="custom-input" placeholder="电子邮箱" autocomplete="off">
                    <div class="error-feedback" id="error-email">
                        <i class="fas fa-circle-exclamation"></i><span>请输入有效的邮箱地址</span>
                    </div>
                </div>

                <div class="form-group">
                    <input type="password" id="password" name="password" class="custom-input" placeholder="设置密码">
                    <div class="error-feedback" id="error-password">
                        <i class="fas fa-circle-exclamation"></i><span>密码至少6位</span>
                    </div>
                </div>

                <div class="form-group">
                    <input type="password" id="confirm_password" name="confirm_password" class="custom-input" placeholder="确认密码">
                    <div class="error-feedback" id="error-confirm">
                        <i class="fas fa-circle-exclamation"></i><span>两次密码输入不一致</span>
                    </div>
                </div>

                <button type="submit" class="btn-register">立即注册</button>
            </form>

            <a href="/login" class="login-link">已有账号？直接登录</a>

            {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}
                <div class="alert alert-danger mt-3 py-2 small text-center rounded-3 border-0 shadow-sm" style="background:#fff0f0; color:#ff4757;">
                    {{ messages[0][1] }}
                </div>
              {% endif %}
            {% endwith %}
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const wrapper = document.getElementById('dotWrapper');
            // 注册页用绿色/青色系粒子
            const colors = ['#00b894', '#55efc4', '#81ecec', '#00cec9', '#ffeaa7'];
            
            const layers = [
                { count: 12, radius: 80, sizeMin: 8, sizeMax: 10 },
                { count: 20, radius: 110, sizeMin: 6, sizeMax: 9 },
                { count: 32, radius: 140, sizeMin: 4, sizeMax: 7 } 
            ];

            layers.forEach((layer) => {
                for (let i = 0; i < layer.count; i++) {
                    const pos = document.createElement('div');
                    pos.classList.add('dot-pos');
                    const angle = (i / layer.count) * 360;
                    pos.style.transform = `rotate(${angle}deg) translate(${layer.radius}px) rotate(-${angle}deg)`;
                    
                    const dot = document.createElement('div');
                    dot.classList.add('dot');
                    const size = Math.random() * (layer.sizeMax - layer.sizeMin) + layer.sizeMin;
                    dot.style.width = size + 'px';
                    dot.style.height = size + 'px';
                    dot.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    dot.style.boxShadow = `0 0 6px ${dot.style.backgroundColor}`;
                    dot.style.animationDelay = (Math.random() * 1) + 's';

                    pos.appendChild(dot);
                    wrapper.appendChild(pos);
                }
            });

            // 聚焦消除错误
            const inputs = document.querySelectorAll('.custom-input');
            inputs.forEach(input => {
                input.addEventListener('focus', function() {
                    this.classList.remove('is-invalid');
                    const errorBox = this.parentElement.querySelector('.error-feedback');
                    if(errorBox) errorBox.classList.remove('show');
                });
            });
        });

        function enterRegister() {
            document.body.classList.add('mode-register');
        }

        // 验证逻辑
        function validateForm() {
            const username = document.getElementById('username');
            const email = document.getElementById('email');
            const password = document.getElementById('password');
            const confirm = document.getElementById('confirm_password');
            let isValid = true;

            // 1. 用户名
            if (username.value.trim().length < 3) {
                showError(username, 'error-username', '用户名至少3个字符');
                isValid = false;
            }

            // 2. 邮箱正则验证
            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailPattern.test(email.value.trim())) {
                showError(email, 'error-email', '请输入有效的邮箱地址');
                isValid = false;
            }

            // 3. 密码
            if (password.value.length < 6) {
                showError(password, 'error-password', '密码至少6位');
                isValid = false;
            }

            // 4. 确认密码
            if (confirm.value !== password.value) {
                showError(confirm, 'error-confirm', '两次密码输入不一致');
                isValid = false;
            }

            return isValid;
        }

        function showError(input, errorId, msg) {
            input.classList.add('is-invalid');
            const errorBox = document.getElementById(errorId);
            errorBox.querySelector('span').innerText = msg;
            errorBox.classList.add('show');
            input.style.animation = 'shake 0.3s';
            setTimeout(() => input.style.animation = '', 300);
        }
    </script>
    <style>
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
    </style>
</body>
</html>
