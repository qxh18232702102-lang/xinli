{% extends "admin_base.html" %}
{% block content %}
<div class="dashboard-card">
    <h5 class="fw-bold mb-4"><i class="fas fa-box-open text-warning me-2"></i>治愈推荐资源库</h5>
    <table class="table table-custom table-hover">
        <thead><tr><th>ID</th><th>绑定情绪</th><th>资源类别</th><th>资源名称 / 内容</th><th>推荐理由 (CBT依据)</th></tr></thead>
        <tbody>
            {% for r in resources %}
            <tr>
                <td>{{ r.id }}</td><td><span class="badge bg-info">{{ r.emotion_type }}</span></td>
                <td class="fw-bold text-secondary">{{ r.category }}</td><td>{{ r.content }}</td><td class="small text-muted">{{ r.reason }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
